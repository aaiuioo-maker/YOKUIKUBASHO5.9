<title>よく行く場所</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a18;--panel:#12122a;--border:#2a2a50;--gold:#e8c84a;--text:#f0ead8;--sub:#8880a0;
  --app-bg:#f7f6f3;--app-surface:#fff;--app-border:rgba(0,0,0,.1);
  --app-text:#111;--app-sub:#666;--app-hint:#aaa;
  --app-blue:#1a6ed8;--app-red:#e02020;--app-green:#1a9a3a;
}
html,body{height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0;width:100%}

/* ── RIPPLE ── */
.ripple-host{position:relative;overflow:hidden}
@keyframes ripple-anim{
  0%{transform:scale(0);opacity:.35}
  100%{transform:scale(2.8);opacity:0}
}
.ripple-dot{
  position:absolute;border-radius:50%;
  background:rgba(0,0,0,.18);pointer-events:none;
  animation:ripple-anim .45s ease-out forwards;
  transform-origin:center;
}

/* ── APP: fixed layout ── */
#app{
  position:fixed;inset:0;z-index:10;background:var(--app-bg);
  font-family:-apple-system,'Helvetica Neue',sans-serif;color:var(--app-text);
  display:flex;flex-direction:column;
}

/* ヘッダー：固定 */
.hdr{
  flex-shrink:0;
  padding:calc(env(safe-area-inset-top) + 8px) 20px 8px;background:var(--app-surface);
  border-bottom:.5px solid var(--app-border);
}
.hdr-title{font-size:26px;font-weight:700;letter-spacing:-.5px}
.hdr-sub{font-size:12px;color:var(--app-sub);margin-top:2px}

/* マップボタンパネル：固定 */
.map-panel{
  flex-shrink:0;
  padding:12px 16px 10px;
  background:var(--app-bg);
  border-bottom:.5px solid var(--app-border);
}
.sec-lbl{font-size:11px;font-weight:600;color:var(--app-hint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;padding:0 2px}
.map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.map-btn{
  background:var(--app-surface);border:.5px solid var(--app-border);
  border-radius:10px;padding:6px 4px;cursor:pointer;min-width:0;
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;-webkit-appearance:none;
}
.map-icon{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.map-name{font-size:11px;font-weight:600;color:var(--app-text);white-space:nowrap}
.map-desc{display:none}
.map-hint{font-size:11px;color:var(--app-hint);text-align:center}

/* スクロール領域：残り全部 */
.scroll-area{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  min-height:0;
}
.sec{padding:0 16px;margin-top:16px}

/* place list */
.place-list{display:flex;flex-direction:column;gap:1px;background:var(--app-border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.pi{
  background:var(--app-surface);padding:10px 12px;
  display:flex;align-items:center;gap:11px;cursor:pointer;
  transition:background .1s;position:relative;
}
.pi.sel{background:#eef4ff}
.pi.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--app-blue)}
.pi-icon{width:40px;height:40px;border-radius:10px;background:#e8e8f0;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.pi.sel .pi-icon{background:#d0e0ff}
.pi-body{flex:1;min-width:0}
.pi-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-addr{font-size:12.5px;color:var(--app-sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-note{font-size:11px;font-weight:400;color:var(--app-sub);background:#f0f0f0;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.pi.sel .pi-note{background:#dde8ff;color:var(--app-blue)}
.pi-arr{
  font-size:24px;color:#ccc;flex-shrink:0;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;margin-left:2px;cursor:pointer;
}
.pi-arr:active{background:#eee;color:#999}
.pi-handle{
  width:38px;height:60px;margin:-10px -2px -10px -10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#b0b0b8;font-size:20px;cursor:grab;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.pi.dragging{z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.2);background:#fff;transition:none!important;pointer-events:none}
.fd.dragging{position:relative;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:none!important;pointer-events:none}
.fd.shifting{transition:transform .15s}
.fd.drag-in{overflow:visible}
.fd.drop-on{box-shadow:0 0 0 2.5px var(--app-blue)}
.fd.drop-on .fd-head{background:#eef4ff}
#topSec.drop-on #placeList{outline:2.5px dashed var(--app-blue);outline-offset:3px;border-radius:12px}
.fd-handle{margin:-10px -4px -10px -6px}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drag-tip{font-size:11px;color:var(--app-hint);text-align:center;margin:8px 0 18px}
.pi.shifting{transition:transform .15s}
.place-list.drag-on{overflow:visible}

.empty-card{background:var(--app-surface);border-radius:12px;padding:24px;text-align:center;color:var(--app-hint);font-size:13px;margin-bottom:12px}
.add-btn{
  width:100%;background:var(--app-surface);border:.5px dashed rgba(0,0,0,.15);
  border-radius:12px;padding:11px;font-size:13px;font-weight:500;color:var(--app-blue);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none;
}

/* フォルダ */
.fd-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.fd{background:var(--app-surface);border-radius:12px;border:.5px solid var(--app-border);overflow:hidden}
.fd-head{display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer}
.fd-ic{width:40px;height:40px;border-radius:10px;background:#fff3d1;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.fd-name{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd-cnt{font-size:12px;color:var(--app-sub);background:#f0f0f0;border-radius:10px;padding:2px 8px;flex-shrink:0}
.fd-chev{font-size:22px;color:#bbb;width:22px;text-align:center;flex-shrink:0;transition:transform .2s}
.fd.open .fd-chev{transform:rotate(90deg)}
.fd-body{display:none;border-top:.5px solid var(--app-border);padding:10px;background:var(--app-bg)}
.fd.open .fd-body{display:block}
.fd-body .place-list{margin-bottom:8px}
.fd-body .empty-card{padding:16px;margin-bottom:8px}
.fd-acts{display:flex;gap:8px}
.fd-acts .add-btn{flex:1}
.fd-del{border:none;background:#ffeeee;color:var(--app-red);border-radius:12px;padding:0 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;flex-shrink:0}
.ff select,.det-sel{width:100%;border:none;outline:none;font-size:16px;color:var(--app-text);padding:5px 0 9px;background:transparent;font-family:inherit}
.det-sel{padding:0;font-size:14px;color:var(--app-blue)}

/* form */
.form-card{background:var(--app-surface);border-radius:12px;overflow:hidden;margin-top:8px;border:.5px solid var(--app-border);display:none}
.form-card.open{display:block}
.ff{padding:0 14px;border-bottom:.5px solid var(--app-border)}
.ff label{display:block;font-size:10px;font-weight:600;color:var(--app-hint);text-transform:uppercase;letter-spacing:.06em;padding-top:9px}
.ff input{width:100%;border:none;outline:none;font-size:15px;color:var(--app-text);padding:5px 0 9px;background:transparent;font-family:inherit}
.ff input::placeholder{color:var(--app-hint)}
.form-acts{display:flex;border-top:.5px solid var(--app-border)}
.fbtn{flex:1;padding:13px;border:none;background:transparent;font-size:15px;cursor:pointer;font-family:inherit}
.fbtn:first-child{border-right:.5px solid var(--app-border);color:var(--app-sub)}
.fbtn.ok{color:var(--app-blue);font-weight:600}

/* backup */
.bk-card{background:var(--app-surface);border-radius:12px;border:.5px solid var(--app-border);overflow:hidden;margin-bottom:52px}
.bk-row{display:flex;align-items:center;padding:12px 14px;border-bottom:.5px solid var(--app-border);gap:10px}

.bk-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.bk-text{flex:1;min-width:0}
.bk-label{font-size:14px;font-weight:500}
.bk-desc{font-size:11px;color:var(--app-hint);margin-top:1px}
.bk-btn{border:none;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0}
.bk-btn.exp{background:#eef4ff;color:var(--app-blue)}
.bk-btn.imp{background:#eefaf2;color:var(--app-green)}
#restoreInput{display:none}

.bk-simple .bk-btn{padding:11px;font-size:14px;border-radius:10px}

/* modals */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--app-surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:16px 20px 44px;transform:translateY(36px);transition:transform .22s}
.overlay.show .sheet{transform:none}
.sh-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 14px}
.sh-title{font-size:17px;font-weight:700;margin-bottom:4px}
.sh-sub{font-size:13px;color:var(--app-sub);line-height:1.6;margin-bottom:14px;white-space:pre-wrap}
.sh-preview{background:#f5f5f5;border-radius:8px;padding:10px 12px;font-size:11px;color:#555;margin-bottom:14px;max-height:90px;overflow-y:auto;line-height:1.7}
.sh-btns{display:flex;flex-direction:column;gap:8px}
.sh-btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.sh-btn.blue{background:var(--app-blue);color:#fff}
.sh-btn.gray{background:#f0f0f0;color:var(--app-sub)}
.sh-btn.red{background:#ffeeee;color:var(--app-red)}

/* detail */
.det-icon{font-size:36px;text-align:center;margin-bottom:10px}
.det-name{font-size:20px;font-weight:700;margin-bottom:6px}
.det-rows{border:.5px solid var(--app-border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.det-row{display:flex;gap:10px;padding:10px 14px;border-bottom:.5px solid var(--app-border);align-items:flex-start}
.det-row:last-child{border-bottom:none}
.det-key{font-size:11px;font-weight:600;color:var(--app-hint);text-transform:uppercase;letter-spacing:.06em;min-width:44px;padding-top:2px}
.det-val{font-size:14px;color:var(--app-text);flex:1;line-height:1.5}
.det-map-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.det-map-row .sh-btn{padding:12px 2px;font-size:13px;white-space:nowrap}

.add-sheet{

<script>
/* ── Ripple ── */
function addRipple(e){
  const el=e.currentTarget;
  const r=el.getBoundingClientRect();
  const size=Math.max(r.width,r.height)*1.4;
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left-size/2;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top-size/2;
  const dot=document.createElement('span');
  dot.className='ripple-dot';
  dot.style.cssText=`width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
  el.appendChild(dot);
  setTimeout(()=>dot.remove(),480);
}
document.addEventListener('pointerdown',e=>{
  const host=e.target.closest('.ripple-host');
  if(host)addRipple({currentTarget:host,clientX:e.clientX,clientY:e.clientY});
},{passive:true});

/* ── Audio ── */
let actx=null;
function initAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function tone(freq,dur,type,vol){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  o.type=type||'square';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.11,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
  o.start();o.stop(actx.currentTime+dur);
}
const sFanfare=()=>[[784,80],[880,80],[988,80],[1047,160],[988,80],[1047,160],[880,80],[1047,280]].reduce((t,[f,d])=>{setTimeout(()=>tone(f,d/1000,'square',.12),t);return t+d+8;},0);
const sCursor =()=>tone(880,.04,'square',.06);
const sSelect =()=>{tone(523,.07,'square',.1);setTimeout(()=>tone(659,.07,'square',.1),65);setTimeout(()=>tone(784,.1,'square',.1),130)};
const sOpen   =()=>[523,587,659,784,880].forEach((f,i)=>setTimeout(()=>tone(f,.09,'square',.1),i*50));
const sAdd    =()=>{tone(659,.07,'square',.09);setTimeout(()=>tone(784,.07,'square',.09),70);setTimeout(()=>tone(1047,.13,'square',.09),140)};
const sDel    =()=>tone(280,.13,'square',.09);
const sErr    =()=>tone(200,.18,'square',.12);
const sScroll =()=>tone(1046,.022,'square',.045);
const sClose  =()=>tone(440,.08,'square',.07);
const sBackup =()=>{tone(784,.07,'square',.09);setTimeout(()=>tone(880,.12,'square',.09),80)};

/* ── Start ── */
document.addEventListener('pointerdown',initAudio,{once:true,capture:true});
/* ── Scroll sound ── */
function setupScroll(el){
  let lastY=0,cnt=0,tick=false;
  el.addEventListener('scroll',()=>{
    if(tick)return;tick=true;
    requestAnimationFrame(()=>{
      const y=el.scrollTop;
      if(Math.abs(y-lastY)>=16){cnt++;if(cnt%2===0)sScroll();lastY=y;}
      tick=false;
    });
  },{passive:true});
}

/* ── Data ── */
const KEY='map_places_v2';
let places=JSON.parse(localStorage.getItem(KEY)||'null');
let sel=-1;
if(!places){places=[];save();}
// 最初から入っていた見本2件を一度だけ取り除く
if(!localStorage.getItem('map_places_sample_removed')){
  const sample=['京都中央郵便局|京都市下京区東塩小路町843-12','京都山科郵便局|京都市山科区安朱稲荷山町35'];
  places=places.filter(p=>!sample.includes(p.name+'|'+p.addr));
  save();localStorage.setItem('map_places_sample_removed','1');
}
function save(){localStorage.setItem(KEY,JSON.stringify(places))}

/* フォルダ：{id,name}。場所は p.folder にフォルダの id を持つ（無ければ「よく行く場所」） */
const FKEY='map_folders_v1',FOPEN='map_folders_open';
let folders=[],openFolders=[];
try{folders=JSON.parse(localStorage.getItem(FKEY)||'[]')||[]}catch(_){folders=[]}
try{openFolders=JSON.parse(localStorage.getItem(FOPEN)||'[]')||[]}catch(_){openFolders=[]}
function saveFolders(){localStorage.setItem(FKEY,JSON.stringify(folders))}
function saveOpen(){try{localStorage.setItem(FOPEN,JSON.stringify(openFolders))}catch(_){}}
function folderOf(p){return p.folder&&folders.some(f=>f.id===p.folder)?p.folder:''}
function folderOptions(){
  return '<option value="">フォルダに入れない</option>'+folders.map(f=>`<option value="${esc(f.id)}">📁 ${esc(f.name)}</option>`).join('');
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);
}

const EMAP=[
  ['郵便局','📮'],['郵便','📮'],['コンビニ','🏪'],['スーパー','🛒'],
  ['駅','🚉'],['病院','🏥'],['銀行','🏦'],['学校','🏫'],
  ['公園','🌳'],['ホテル','🏨'],['空港','✈️'],['港','⚓'],['図書館','📚'],
];
function autoEmoji(name){for(const[k,v]of EMAP){if(name.includes(k))return v;}return '📍'}
function emoji(p){return (p&&p.icon)||autoEmoji(p?p.name:'')}

const CUSTOM_KEY='map_custom_icons';
function getCustom(){try{return JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]')}catch(_){return []}}
function setCustom(a){try{localStorage.setItem(CUSTOM_KEY,JSON.stringify(a))}catch(_){toast('保存できる容量を超えました')}}
function iconSrc(ic){
  if(!ic)return null;
  if(ic.startsWith('img:'))return IMG_ICONS[ic.slice(4)]||null;
  if(ic.startsWith('data:image'))return ic;
  return null;
}
function iconHTML(ic){
  const src=iconSrc(ic);
  return src?`<img class="ic-img" src="${src}" alt="">`:esc(ic||'📍');
}

/* ── 並べ替え（指でドラッグ） ── */
let drag=null,dragEndAt=0;
function evY(e){return e.touches&&e.touches.length?e.touches[0].clientY:(e.changedTouches&&e.changedTouches.length?e.changedTouches[0].clientY:e.clientY)}
function evX(e){return e.touches&&e.touches.length?e.touches[0].clientX:(e.changedTouches&&e.changedTouches.length?e.changedTouches[0].clientX:e.clientX)}
function dragStart(e){
  const hd=e.target.closest('.pi-handle');
  if(!hd||drag)return;
  e.preventDefault();e.stopPropagation();
  // 場所（.pi）かフォルダ（.fd）を、同じリストの中で並べ替える
  const isFolder=hd.classList.contains('fd-handle');
  const row=hd.closest(isFolder?'.fd':'.pi');
  const rows=[...row.parentNode.querySelectorAll(isFolder?':scope > .fd':':scope > .pi')];
  const i=rows.indexOf(row);
  const g=rows.map(r=>+(isFolder?r.dataset.f:r.dataset.i));
  const sa=document.getElementById('scrollArea');
  const rects=rows.map(r=>r.getBoundingClientRect());
  const mids=rects.map(b=>b.top+b.height/2+sa.scrollTop); // スクロールしても変わらない位置
  const gap=rows.length>1?rects[1].top-rects[0].bottom:0;
  const last=rects[rects.length-1];
  drag={kind:isFolder?'folder':'place',i,to:i,g,rows,row,mids,sa,h:rects[i].height+gap,
    top:rects[i].top+sa.scrollTop,bot:rects[i].bottom+sa.scrollTop,
    startY:evY(e),y:evY(e),x:evX(e),startScroll:sa.scrollTop,
    minDy:rects[0].top-rects[i].top,maxDy:last.bottom-rects[i].bottom,
    src:isFolder?'':folderOf(places[g[i]]),drop:null};
  row.parentNode.classList.add('drag-on');
  const box=!isFolder&&row.closest('.fd');if(box)box.classList.add('drag-in');
  row.classList.add('dragging');
  rows.forEach(r=>{if(r!==row)r.classList.add('shifting')});
  drag.timer=setInterval(autoScroll,16);
  sCursor();
}
// 画面の上下の端に近づけたら、自動でスクロールする
function autoScroll(){
  if(!drag)return;
  const b=drag.sa.getBoundingClientRect();
  let v=0;
  if(drag.y<b.top+60)v=-Math.ceil((b.top+60-drag.y)/5);
  else if(drag.y>b.bottom-60)v=Math.ceil((drag.y-(b.bottom-60))/5);
  if(!v)return;
  const before=drag.sa.scrollTop;
  drag.sa.scrollTop+=v;
  if(drag.sa.scrollTop!==before)dragUpdate();
}
function dragMove(e){
  if(!drag)return;
  e.preventDefault();
  drag.y=evY(e);drag.x=evX(e);
  dragUpdate();
}
function dragUpdate(){
  const d=drag;
  let dy=d.y-d.startY+(d.sa.scrollTop-d.startScroll);
  if(d.kind==='folder')dy=Math.max(d.minDy,Math.min(d.maxDy,dy));
  d.row.style.transform=`translateY(${dy}px)`;
  // 場所を別のフォルダ（または「よく行く場所」）の上に持っていったら、そこに入れる
  let drop=null;
  if(d.kind==='place'){
    const el=document.elementFromPoint(d.x,d.y);
    const fd=el&&el.closest('.fd');
    if(fd&&!fd.contains(d.row))drop={folder:folders[+fd.dataset.f].id,el:fd};
    else if(!fd&&d.src&&el&&el.closest('#topSec'))drop={folder:'',el:document.getElementById('topSec')};
  }
  const pe=d.drop&&d.drop.el,ne=drop&&drop.el;
  if(pe!==ne){pe&&pe.classList.remove('drop-on');if(ne){ne.classList.add('drop-on');sCursor();}}
  d.drop=drop;
  // 並べ替え先：持っている行の端（下へなら下端、上へなら上端）が、ほかの行の真ん中を越えたら入れ替える
  let to=d.i;
  if(!drop){
    const edge=dy>0?d.bot+dy:d.top+dy;
    to=d.mids.filter((m,j)=>j!==d.i&&m<edge).length;
  }
  if(to!==d.to){d.to=to;sCursor();}
  d.rows.forEach((r,j)=>{
    if(j===d.i)return;
    let off=0;
    if(d.i<to&&j>d.i&&j<=to)off=-d.h;
    if(d.i>to&&j<d.i&&j>=to)off=d.h;
    r.style.transform=off?`translateY(${off}px)`:'';
  });
}
function dragEnd(){
  if(!drag)return;
  const d=drag;
  drag=null;dragEndAt=Date.now();clearInterval(d.timer);
  const cur=sel>=0?places[sel]:null;
  if(d.drop){
    // 別のフォルダへ移す（移した先の一番下に入る）
    const k=d.g[d.i],p=places[k];
    places.splice(k,1);places.push(p);
    if(d.drop.folder)p.folder=d.drop.folder;else delete p.folder;
    sel=cur?places.indexOf(cur):-1;
    save();sAdd();
    const f=folders.find(x=>x.id===d.drop.folder);
    toast(f?'📁 '+f.name+' に入れました':'フォルダから出しました');
  }else if(d.to!==d.i){
    if(d.kind==='folder'){
      const [m]=folders.splice(d.i,1);
      folders.splice(d.to,0,m);
      saveFolders();
    }else{
      // このリストの場所だけを並べ替えて、元の位置に戻す
      const items=d.g.map(k=>places[k]);
      const [m]=items.splice(d.i,1);
      items.splice(d.to,0,m);
      d.g.forEach((k,j)=>{places[k]=items[j]});
      sel=cur?places.indexOf(cur):-1;
      save();
    }
    sAdd();
  }
  render();
}
(function(){
  const list=document.getElementById('scrollArea');
  // iPhone：タッチイベントで直接受け取る（スクロールを止めるため passive:false）
  list.addEventListener('touchstart',dragStart,{passive:false});
  document.addEventListener('touchmove',dragMove,{passive:false});
  document.addEventListener('touchend',dragEnd);
  document.addEventListener('touchcancel',dragEnd);
  // パソコン：マウス
  list.addEventListener('mousedown',dragStart);
  document.addEventListener('mousemove',dragMove);
  document.addEventListener('mouseup',dragEnd);
})();

function copyText(s){
  const fallback=()=>{
    const t=document.createElement('textarea');
    t.value=s;t.setAttribute('readonly','');t.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t);t.select();t.setSelectionRange(0,s.length);
    try{document.execCommand('copy')}catch(_){}
    document.body.removeChild(t);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).catch(fallback);
  else fallback();
}

/* ── Backup ── */
let pendingRestore=null;
function exportBackup(){
  const latest=JSON.parse(localStorage.getItem(KEY)||'[]');
  if(!latest.length&&!folders.length){sErr();toast('登録されている場所がありません');return;}
  const json=JSON.stringify({version:3,exportedAt:new Date().toISOString(),count:latest.length,places:latest,folders},null,2);
  const date=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const fname='map_places_'+date+'.json';
  try{
    const b=new Blob([json],{type:'application/json'});
    const u=URL.createObjectURL(b);
    const a=Object.assign(document.createElement('a'),{href:u,download:fname});
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);document.body.removeChild(a);},800);
  }catch(_){
    const a=Object.assign(document.createElement('a'),{href:'data:application/json;charset=utf-8,'+encodeURIComponent(json),download:fname});
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
  sBackup();toast(latest.length+'件を書き出しました');
}
function importBackup(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const raw=JSON.parse(ev.target.result);
      const loaded=Array.isArray(raw)?raw:(raw.places&&Array.isArray(raw.places)?raw.places:null);
      const lf=(!Array.isArray(raw)&&Array.isArray(raw.folders))?raw.folders.filter(f=>f&&typeof f.id==='string'&&typeof f.name==='string'):[];
      if(!loaded||(!loaded.length&&!lf.length)||(loaded.length&&typeof loaded[0].name!=='string'))throw 0;
      pendingRestore={places:loaded,folders:lf};
      document.getElementById('restoreSub').textContent=file.name+'\n'+loaded.length+'件'+(lf.length?'（フォルダ'+lf.length+'個）':'')+'が見つかりました。現在の'+places.length+'件は上書きされます。';
      document.getElementById('restorePreview').textContent=loaded.slice(0,6).map(p=>'・'+p.name+' — '+p.addr).join('\n')+(loaded.length>6?'\n…他'+(loaded.length-6)+'件':'');
      document.getElementById('restoreModal').classList.add('show');
      sSelect();
    }catch(_){sErr();toast('ファイルの形式が正しくありません');}
    e.target.value='';
  };
  reader.readAsText(file,'utf-8');
}
function confirmRestore(){
  if(!pendingRestore)return;
  places=pendingRestore.places;folders=pendingRestore.folders;pendingRestore=null;
  openFolders=openFolders.filter(id=>folders.some(f=>f.id===id));
  sel=-1;save();saveFolders();saveOpen();render();closeRestore();
  sFanfare();toast(places.length+'件を復元しました');
}
function closeRestore(){
  document.getElementById('restoreModal').classList.remove('show');
  sClose();pendingRestore=null;
}
document.getElementById('restoreModal').addEventListener('click',function(e){if(e.target===this)closeRestore();});

render();
setupScroll(document.getElementById('scrollArea'));
function resetView(){window.scrollTo(0,0);document.body.scrollTop=0;document.documentElement.scrollTop=0;}
document.addEventListener('focusout',()=>setTimeout(resetView,50));
window.addEventListener('scroll',()=>{if(window.scrollY&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName))resetView();});
if(window.visualViewport){
  visualViewport.addEventListener('resize',()=>setTimeout(resetView,50));
}

// Claude Code のキャラクター（ヘッダー左上）：右へ歩く → 端で立ち止まって振り向く → 左へ戻る
(function ccMascot() {
  const svg = document.querySelector('.cc-mascot svg');
  if (!svg) return;
  const body = svg.querySelector('.cc-hop');
  const armL = svg.querySelector('.cc-arm-l');
  const armR = svg.querySelector('.cc-arm-r');
  const legs = Array.from(svg.querySelectorAll('.cc-leg'));
  const HALF = 12, STEP = 2, TICK = 220, IDLE_TICKS = 9;
  let x = -HALF, dir = 1, mode = 'idle', t = 0;
  const legUp = (i, up) => legs[i].setAttribute('height', up ? 1 : 2);
  const armUp = (el, up) => el.setAttribute('y', up ? 1 : 2);
  const bob = up => body.setAttribute('transform', up ? 'translate(0,-1)' : '');
  const rest = () => { legs.forEach((_, i) => legUp(i, false)); armUp(armL, false); armUp(armR, false); bob(false); };
  const draw = () => { svg.style.transform = `translateX(${x}px) scaleX(${dir})`; };
  function tick() {
    t++;
    if (mode === 'walk') {
      const ph = t % 2;
      armUp(armL, false); armUp(armR, false);
      legUp(0, ph === 0); legUp(2, ph === 0);
      legUp(1, ph === 1); legUp(3, ph === 1);
      bob(ph === 0);
      x += STEP * dir;
      if (x <= -HALF || x >= HALF) { x = Math.max(-HALF, Math.min(HALF, x)); mode = 'idle'; t = 0; rest(); }
    } else {
      const ph = t % 4;
      armUp(armL, ph === 1); armUp(armR, ph === 3);
      legUp(0, ph === 2); legUp(3, ph === 0);
      bob(false);
      if (t === Math.floor(IDLE_TICKS / 2)) dir = (x >= HALF) ? -1 : 1;
      if (t >= IDLE_TICKS) { mode = 'walk'; t = 0; rest(); }
    }
    draw();
  }
  draw();
  setInterval(tick, TICK);
})();
</script>
